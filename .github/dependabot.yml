# Dependabot: weekly dependency update PRs, grouped to keep noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch bumps.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major npm upgrades are done deliberately, in batches we choose, not as drive-by PRs.
      # Many majors are coupled (prisma 7 migration, next with its eslint plugin, vitest with
      # its coverage provider, typescript with typescript-eslint, @types/node pinned to the
      # Node 20 runtime, @hookform/resolvers with the zod and react-hook-form versions), so
      # upgrading them one PR at a time is noise or risk. Remove this rule to resume them.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # All action bumps in a single PR instead of one per action.
      actions:
        patterns: ["*"]
